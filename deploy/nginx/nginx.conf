# Replace api.example.com with your domain. Certificates are expected at
# deploy/certs/fullchain.pem and deploy/certs/privkey.pem (see SETUP_GUIDE.md).

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream melodia_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://melodia_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Readiness details only from inside the host network.
    location = /health/ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://melodia_backend;
    }
}
