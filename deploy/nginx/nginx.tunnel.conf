# nginx behind a Cloudflare Tunnel (docker-compose.cloudflare.yml).
# Cloudflare terminates TLS; cloudflared reaches nginx over the compose network on plain HTTP,
# so no ports are published on the host and no certificates live on the server.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream melodia_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Every request arrives from the cloudflared container; rate-limit and log the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://melodia_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Readiness details only from inside the nginx container (docker compose exec nginx ...).
    location = /health/ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://melodia_backend;
    }
}
