# Serve the API through a Cloudflare Tunnel instead of public ports 80/443.
# Usage: docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d --build
# Needs CLOUDFLARE_TUNNEL_TOKEN in .env (`cloudflared tunnel token <name>`), and a DNS route for the
# API hostname (`cloudflared tunnel route dns <name> api.example.com`). Requires docker compose 2.24+.
services:
  nginx:
    ports: !reset []
    volumes: !override
      - ./deploy/nginx/nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    depends_on: [nginx]
    command: ["tunnel", "--no-autoupdate", "run", "--url", "http://nginx:8080"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
