# Full stack: nginx -> backend (FastAPI) -> PostgreSQL, Redis, and the music provider
# (Audius public API by default; GaanaPy with MUSIC_PROVIDER=gaana and --profile gaana).
# Usage: cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
name: melodia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-melodia}
      POSTGRES_USER: ${POSTGRES_USER:-melodia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gaanapy:
    # Only for MUSIC_PROVIDER=gaana: `docker compose --profile gaana up -d`.
    # Vendored copy with local fixes (third_party/patches/gaanapy-local-fixes.patch).
    profiles: [gaana]
    build: ./third_party/GaanaPy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      gaanapy: { condition: service_started, required: false }
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-melodia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-melodia}
      REDIS_URL: redis://redis:6379/0
      # audius (default): public Audius API. gaana: the gaanapy service (needs --profile gaana).
      MUSIC_PROVIDER: ${MUSIC_PROVIDER:-audius}
      AUDIUS_APP_NAME: ${AUDIUS_APP_NAME:-Melodia}
      GAANAPY_BASE_URL: http://gaanapy:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LYRICS_USER_AGENT: ${LYRICS_USER_AGENT:-Melodia/1.0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro

volumes:
  pgdata:
  certbot-www:

# Own bridge network, so the stack stays apart from other containers on the server.
networks:
  default:
    name: melodia-net
    driver: bridge
